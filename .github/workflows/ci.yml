name: cicd-pipeline

on:
  push:
    branches: [ main, dev/v2 ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12", "3.13" ]
        uv-version: [ "0.10.11" ]
        os: [ "ubuntu-24.04", "macos-latest" ]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install "uv==${{ matrix.uv-version }}"
          uv --version

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-uv-${{ hashFiles('src/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-uv-

      - name: Sync dependencies
        run: |
          uv sync --project ./src --all-groups

      - name: Install project as editable
        working-directory: ./src
        run: |
          uv pip install -e .

      - name: Run pre-commit hooks
        run: |
          uv run --project ./src pre-commit run -vvv --all-files

      - name: Run tests with coverage
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 10
          command: |
            uv run --project ./src pytest \
              -n auto \
              -vv \
              --log-level=INFO \
              --disable-warnings \
              --cov=archeo \
              --rootdir=./src \
              --cov-report=xml:coverage.xml \
              --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: ${{ matrix.python-version == '3.12' && matrix.os == 'ubuntu-24.04' }}
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
